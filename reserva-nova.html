<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Hotel Pet - Pets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <img src="imagens/logo.png" alt="Hotel Pet">
    <p>Hotel Pet</p>
    <nav>
        <a href="pets.html">Pet</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
        <a href="reservas.html">Reservas</a>
    </nav>
    <a href="perfil.html">
        <img src="imagens/avatar-exemplo.png" alt="Foto do usuário logado">
        Nome do Gerente
    </a>
</header>

<main>

    <p>
        <a href="reservas.html">Home / Reserva </a> /
        Nova Reserva
    </p>

    <form>
        <label for="pet">Pet*</label>
        <select id="pet" name="pet" required>
            <option value="">Selecione</option>
            <option value="1">Rex</option>
            <option value="2">Mia</option>
        </select>

        <label for="chegada">Data de chegada*</label>
        <input type="date" id="chegada" name="chegada" required>

        <label for="partida">Data de partida*</label>
        <input type="date" id="partida" name="partida" required>

        <label for="notas">Notas</label>
        <textarea id="notas" name="notas"></textarea>

        <label for="total">Total das diárias</label>
        <input type="text" id="total" name="total" value="R$ 0,00" readonly>

        <button type="submit">Salvar</button>
        <button type="reset">Limpar</button>
    </form>

</main>

<footer>
    <p>&copy; 2026 Hotel Pet</p>
</footer>
</body>
</html>
