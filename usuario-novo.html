<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Hotel Pet - Novo Usuário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <img src="imagens/logo.png" alt="Hotel Pet">
    <p>Hotel Pet</p>
    <nav>
        <a href="pets.html">Pet</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
        <a href="reservas.html">Reservas</a>
    </nav>
    <a href="perfil.html">
        <img src="imagens/avatar-exemplo.png" alt="Foto do usuário logado">
        Nome do Gerente
    </a>
</header>

<main>

    <p>
        <a href="reservas.html">Home</a> /
        <a href="usuarios.html">Usuários</a> /
        Novo Usuário
    </p>

    <form>
        <label for="email">Email*</label>
        <input type="email" id="email" name="email" required>

        <label for="nome">Nome*</label>
        <input type="text" id="nome" name="nome" required>

        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" name="sobrenome">

        <label for="telefone">Telefone*</label>
        <input type="tel" id="telefone" name="telefone" required>

        <label for="funcao">Função</label>
        <select id="funcao" name="funcao">
            <option value="funcionario">Funcionário</option>
            <option value="cliente">Cliente</option>
            <option value="gerente">Gerente</option>
        </select>

        <label for="foto">Foto</label>
        <input type="file" id="foto" name="foto" accept="image/*">

        <button type="submit">Salvar</button>
        <button type="reset">Limpar</button>
    </form>

</main>

<footer>
    <p>&copy; 2026 Hotel Pet</p>
</footer>
</body>
</html>
