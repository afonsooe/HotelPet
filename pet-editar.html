<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Hotel Pet - Editar Pet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <img src="imagens/logo.png" alt="Hotel Pet">
    <p>Hotel Pet</p>
    <nav>
        <a href="pets.html">Pet</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
        <a href="reservas.html">Reservas</a>
    </nav>
    <a href="perfil.html">
        <img src="imagens/avatar-exemplo.png" alt="Foto do usuário logado">
        Gerente
    </a>
</header>

<main>

    <p>
        <a href="reservas.html">Home</a> /
        <a href="pets.html">Pet</a> /
        Editar Pet
    </p>

    <form>
        <label for="nome-pet">Nome*</label>
        <input type="text" id="nome-pet" name="nome-pet" value="Rex" required>

        <label for="tipo">Tipo*</label>
        <select id="tipo" name="tipo" required>
            <option value="cachorro" selected>Cachorro</option>
            <option value="gato">Gato</option>
            <option value="outro">Outro</option>
        </select>

        <label for="raca">Raça*</label>
        <input type="text" id="raca" name="raca" value="Labrador" required>

        <label for="tamanho">Tamanho*</label>
        <select id="tamanho" name="tamanho" required>
            <option value="pequeno">Pequeno</option>
            <option value="medio">Médio</option>
            <option value="grande" selected>Grande</option>
        </select>

        <label for="imagem">Imagem</label>
        <input type="file" id="imagem" name="imagem" accept="image/*">

        <button type="submit">Salvar</button>
        <button type="reset">Limpar</button>
    </form>

</main>

<footer>
    <p>&copy; 2026 Hotel Pet</p>
</footer>
</body>
</html>
